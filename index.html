<style>
    :root {
      --ink: #0A0C10;
      --panel: #12151C;
      --panel-line: #232830;
      --text: #EDEFF2;
      --text-dim: #9AA2AD;
      --signal: #5B8DEF;
      --pulse: #FFC857;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --display: 'Orbitron', var(--mono);
      --body: 'Rajdhani', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .loading-screen {
      position: fixed; inset: 0; z-index: 999; background: #000;
    }

    .ui-spark {
      position: fixed; width: 6px; height: 6px; border-radius: 50%;
      background: var(--pulse); pointer-events: none; z-index: 300;
      animation: sparkle-fly 0.5s ease-out forwards;
    }
    @keyframes sparkle-fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    #netCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #netCanvas { display: none; } }

    header, main, footer { position: relative; z-index: 1; }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 5%;
      background: rgba(10,12,16,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-line);
    }
    .logo {
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-left: 66px; /* clears hamburger */
      white-space: nowrap;
      overflow: hidden;
      max-width: calc(100vw - 140px);
    }
    .logo span { color: var(--signal); }
    #navLinks {
      display: flex; align-items: center; gap: 2rem;
    }
    nav ul {
      list-style: none; display: flex; gap: 2rem;
    }
    nav a {
      color: var(--text-dim);
      font-size: 1.05rem;
      font-weight: 700;
      font-family: var(--body);
      transition: color 0.2s ease;
      position: relative;
    }
    nav a:hover, nav a:focus-visible { color: var(--text); }
    nav a.active { color: var(--text); }
    nav a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -0.55rem;
      height: 2px; background: var(--signal); border-radius: 2px;
    }
    .nav-cta {
      background: linear-gradient(135deg, var(--signal), #6E9FF5);
      color: var(--ink) !important; padding: 0.55rem 1.2rem;
      border-radius: 6px; font-weight: 700; font-size: 0.88rem;
      letter-spacing: 0.02em;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -8px rgba(91,141,239,0.5);
    }
    @media (max-width: 780px) {
      #navLinks ul { display: none; }
      nav { padding-left: 1rem; }
      .logo { margin-left: 66px; }
    }

    /* ============================================================
       HAMBURGER MENU TOGGLE
       ============================================================ */
    .global-menu-toggle {
      position: fixed; top: 0.85rem; left: 1rem; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .global-menu-toggle:hover {
      border-color: var(--signal);
      box-shadow: 0 0 20px rgba(91,141,239,0.25);
    }
    .global-menu-toggle .bars {
      display: flex; flex-direction: column; gap: 4px;
    }
    .global-menu-toggle .bars span {
      width: 20px; height: 2px; background: var(--signal);
      display: block; border-radius: 2px;
      transition: transform 0.28s ease, opacity 0.2s ease;
    }
    .global-menu-toggle.open .bars span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .global-menu-toggle.open .bars span:nth-child(2) { opacity: 0; }
    .global-menu-toggle.open .bars span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    /* ============================================================
       DRAWER
       ============================================================ */
    .drawer-overlay {
      display: none; position: fixed; inset: 0; z-index: 55;
      background: rgba(10,12,16,0.15);
      backdrop-filter: blur(6px) saturate(115%);
      -webkit-backdrop-filter: blur(6px) saturate(115%);
      opacity: 0; transition: opacity 0.3s ease;
    }
    .drawer-overlay.open { display: block; }
    .drawer-overlay.show { opacity: 1; }

    .events-drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 82vw; max-width: 340px; z-index: 60;
      background: rgba(18,21,28,0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid var(--panel-line);
      box-shadow: 24px 0 60px -20px rgba(0,0,0,0.6);
      transform: translateX(-100%);
      transition: transform 0.32s cubic-bezier(.4,.2,.2,1);
      display: flex; flex-direction: column;
      padding: 1.2rem 0.8rem 1.2rem 0.8rem;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .events-drawer::-webkit-scrollbar { display: none; }
    .events-drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--display); font-size: 1rem;
      padding: 0.6rem 0.6rem 1rem;
      border-bottom: 1px solid var(--panel-line);
      margin-bottom: 0.6rem; flex-shrink: 0;
    }
    .drawer-close {
      background: none; border: 1px solid transparent;
      color: var(--text-dim); font-size: 1.1rem; cursor: pointer;
      width: 32px; height: 32px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .drawer-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    .drawer-nav-links {
      display: flex; flex-direction: column; gap: 0.15rem;
      padding-bottom: 0.7rem; margin-bottom: 0.7rem;
      border-bottom: 1px solid var(--panel-line); flex-shrink: 0;
    }
    .drawer-nav-links.hidden { display: none; }
    .drawer-nav-links a {
      color: var(--text-dim);
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.75rem 0.85rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s, padding-left 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .drawer-nav-links a:hover {
      background: rgba(91,141,239,0.1); color: var(--text); padding-left: 0.9rem;
    }

    .drawer-back-btn {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: var(--mono); font-size: 0.8rem; color: var(--signal);
      background: none; border: 1px solid var(--panel-line);
      border-radius: 6px; padding: 0.5rem 0.75rem; cursor: pointer;
      margin-bottom: 1rem; flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .drawer-back-btn:hover { background: rgba(91,141,239,0.1); border-color: var(--signal); }
    .drawer-back-btn.hidden { display: none; }

    .drawer-list {
      display: flex; flex-direction: column; gap: 1rem;
      flex-shrink: 0;
      padding-bottom: 1rem;
    }
    .drawer-group-heading {
      font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--signal);
      padding: 0.9rem 0.4rem 0.3rem;
      border-top: 1px solid var(--panel-line);
      margin-bottom: 0.4rem;
    }
    .drawer-group-heading:first-child { border-top: none; padding-top: 0.2rem; }

    /* ============================================================
       FLIP CARDS
       ============================================================ */
    .drawer-flip {
      perspective: 1000px;
      height: 140px;
      width: 100%;
      cursor: pointer;
      flex-shrink: 0;
    }
    .drawer-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
      transform-style: preserve-3d;
    }
    .drawer-flip.flipped .drawer-flip-inner { transform: rotateY(180deg); }
    .drawer-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-front {
      background: rgba(91,141,239,0.06);
      border: 1px solid var(--panel-line);
      justify-content: center;
      align-items: flex-start;
      gap: 0.4rem;
      z-index: 2;
    }
    .drawer-front .item-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      text-align: left;
      line-height: 1.2;
    }
    .drawer-front .tap-hint {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      text-align: left;
    }
    .drawer-back {
      background: var(--panel);
      border: 1px solid var(--signal);
      transform: rotateY(180deg);
      justify-content: space-between;
      align-items: flex-start;
      z-index: 1;
    }
    .drawer-back p {
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.4;
      text-align: left;
      margin: 0;
    }
    /* Fee line removed from flip card per request — button now stands alone */
    .drawer-back .btn-small {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.5rem 0.9rem;
      border-radius: 7px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--signal), #86ADFF);
      box-shadow: 0 4px 14px -6px rgba(91,141,239,0.55);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
      align-self: flex-start;
      margin-top: 0.5rem;
      text-decoration: none;
    }
    .drawer-back .btn-small:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(91,141,239,0.7);
    }

    /* ============================================================
       HERO SECTION
       ============================================================ */
    .hero {
      position: relative; min-height: 85vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 20px 5% 0 5%; max-width: 960px;
    }
    .hero::before {
      content: ""; position: absolute; top: -15%; left: -12%;
      width: 70%; height: 80%;
      background: radial-gradient(circle, rgba(91,141,239,0.2), transparent 70%);
      filter: blur(60px); pointer-events: none; z-index: -1;
    }
    .hero::after {
      content: ""; position: absolute; bottom: -10%; right: -8%;
      width: 50%; height: 50%;
      background: radial-gradient(circle, rgba(255,200,87,0.1), transparent 70%);
      filter: blur(50px); pointer-events: none; z-index: -1;
    }

    .hero-text-block {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 0.5rem; margin-bottom: 2rem;
    }

    /* --- College identity block: logo + name/dept --- */
    .hero-college-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .hero-logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 14px rgba(91,141,239,0.35));
    }
    .hero-college-text {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .hero-college {
      font-family: var(--display);
      font-size: clamp(1.15rem, 2.6vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      margin: 0;
      line-height: 1.3;
      text-align: left;
    }
    .hero-dept {
      font-family: var(--body);
      font-size: clamp(1rem, 2vw, 1.22rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-dim);
      margin: 0;
      line-height: 1.4;
      text-align: left;
      max-width: 46ch;
    }
    .hero-presents {
      font-family: var(--display);
      font-size: clamp(1.1rem, 2.6vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--signal);
      margin: 0.6rem 0 1rem 0;
      line-height: 1.2;
      opacity: 0.95;
    }
    .hero h1 {
      font-family: var(--display);
      font-size: clamp(1.6rem, 9vw, 5.5rem);
      line-height: 1.05; margin: 0 0 0.6rem 0;
      letter-spacing: -0.01em; text-align: left; align-self: flex-start;
      white-space: nowrap;
      max-width: 100%;
    }
    #heroTitle {
      background: linear-gradient(135deg, #FFFFFF 20%, var(--signal) 65%, var(--pulse) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero .tagline {
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      color: var(--text-dim); margin: 0 0 2.2rem 0;
      max-width: 34ch; font-weight: 500; text-align: left;
      align-self: flex-start; line-height: 1.4;
    }
    .hero-meta {
      display: flex; flex-wrap: wrap; gap: 2.8rem;
      font-family: var(--mono); font-size: 0.85rem;
      color: var(--text-dim); margin-bottom: 2.5rem;
    }
    .hero-meta > div { text-align: left; }
    .hero-meta strong {
      color: var(--text); display: block; font-family: var(--body);
      font-size: 1.1rem; font-weight: 600; margin-bottom: 0.15rem;
    }
    .cta-row {
      display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem; min-height: 50px; padding: 0.9rem 2rem;
      border-radius: 8px; font-weight: 700; font-size: 0.95rem;
      letter-spacing: 0.01em; border: none; cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--signal), #7BA5FF);
      color: var(--ink);
      box-shadow: 0 8px 28px -8px rgba(91,141,239,0.55);
    }
    .btn-primary:hover { box-shadow: 0 14px 34px -8px rgba(91,141,239,0.7); }
    .btn-ghost {
      border: 1px solid var(--panel-line); color: var(--text);
      background: rgba(255,255,255,0.02);
    }
    .btn-ghost:hover { border-color: var(--signal); background: rgba(91,141,239,0.08); }

    /* Countdown */
    .countdown-wrap { margin-top: 0.5rem; }
    .countdown-label {
      font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--text-dim); margin-bottom: 0.7rem; text-align: left;
    }
    .countdown { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; }
    .countdown .cd-unit {
      background: linear-gradient(180deg, var(--panel), #0D1017);
      border: 1px solid var(--panel-line); border-radius: 10px;
      padding: 0.8rem 1.1rem; min-width: 78px; text-align: center;
      box-shadow: 0 10px 24px -16px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .countdown .cd-value {
      display: block; font-family: var(--mono); font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--pulse);
      letter-spacing: 0.02em; text-shadow: 0 0 20px rgba(255,200,87,0.3);
    }
    .countdown .cd-value.tick { animation: cd-tick 0.35s ease; }
    @keyframes cd-tick {
      0% { transform: translateY(-5px); opacity: 0.5; text-shadow: 0 0 28px rgba(255,200,87,0.7); }
      100% { transform: translateY(0); opacity: 1; }
    }
    .countdown .cd-unit-label {
      display: block; font-family: var(--mono); font-size: 0.64rem;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-top: 0.3rem;
    }
    .countdown .cd-sep { font-family: var(--mono); font-size: 1.5rem; color: var(--panel-line); padding-bottom: 0.6rem; }
    .countdown .cd-ms { font-family: var(--mono); font-size: 0.7rem; color: var(--signal); padding-bottom: 0.4rem; }
    .countdown .cd-done { font-family: var(--display); font-size: 1.2rem; color: var(--pulse); padding: 0.8rem 1.2rem; }

    /* Sections */
    section { padding: 5rem 5%; max-width: 1200px; margin: 0 auto; }
    .section-label {
      font-family: var(--mono); font-size: 0.78rem; color: var(--signal);
      text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.6rem;
    }
    h2 {
      font-family: var(--display);
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.01em;
      margin: 0 0 1rem 0;
    }
    .section-sub { color: var(--text-dim); max-width: 60ch; margin: 0 0 2.5rem 0; line-height: 1.6; }

    .counter-section { padding-top: 3rem; padding-bottom: 3rem; }
    .counter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
    .counter-card {
      background: linear-gradient(180deg, var(--panel), #0D1017);
      border: 1px solid var(--panel-line); border-radius: 10px;
      padding: 2rem 1.2rem; text-align: center;
      box-shadow: inset 0 0 0 1px rgba(91,141,239,0.03), 0 10px 24px -18px rgba(0,0,0,0.8);
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
    }
    .counter-card:hover {
      border-color: var(--signal); transform: translateY(-4px);
      box-shadow: 0 16px 32px -16px rgba(91,141,239,0.35);
    }
    .counter-value {
      font-family: var(--mono); font-weight: 700;
      font-size: clamp(2.4rem, 5.5vw, 3rem); color: var(--signal); letter-spacing: 0.02em;
    }
    .counter-card.pulse .counter-value { color: var(--pulse); }
    .counter-label {
      font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); margin-top: 0.5rem;
    }

    .events-track { margin-top: 3rem; }
    .track-choice { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .cat-btn {
      flex: 1; min-width: 260px;
      background: linear-gradient(180deg, var(--panel), #0D1017);
      border: 1px solid var(--panel-line); border-radius: 14px;
      padding: 2.8rem 2rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.8rem; cursor: pointer;
      color: var(--text); -webkit-tap-highlight-color: transparent;
      box-shadow: 0 12px 28px -18px rgba(0,0,0,0.8);
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
      text-align: center;
    }
    .cat-btn:hover {
      border-color: var(--signal); transform: translateY(-5px);
      box-shadow: 0 20px 36px -16px rgba(91,141,239,0.45);
    }
    .cat-btn:active { transform: translateY(-2px) scale(0.98); }
    .cat-btn .cat-icon { font-size: 2.5rem; color: var(--signal); line-height: 1; }
    .cat-btn .cat-label { font-family: var(--display); font-size: 1.35rem; font-weight: 700; }
    .cat-btn .cat-sub { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.04em; }
    .cat-btn .cat-count { font-family: var(--mono); font-size: 0.8rem; color: var(--pulse); margin-top: 0.2rem; }

    /* No sponsors section – removed */
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.2rem; }
    .contact-card {
      background: linear-gradient(180deg, var(--panel), #0D1017);
      border: 1px solid var(--panel-line); border-radius: 10px;
      padding: 1.6rem; display: flex; flex-direction: column; gap: 0.5rem;
      box-shadow: 0 10px 24px -18px rgba(0,0,0,0.8);
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s; text-align: left;
    }
    .contact-card:hover {
      border-color: var(--signal); transform: translateY(-3px);
      box-shadow: 0 14px 28px -16px rgba(91,141,239,0.3);
    }
    .contact-card .card-icon { font-size: 1.6rem; color: var(--signal); }
    .contact-card .card-label {
      font-family: var(--mono); font-size: 0.74rem; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .contact-card .card-value { font-family: var(--display); font-size: 1.05rem; word-break: break-word; }
    .contact-card a.card-value { color: var(--signal); }

    footer {
      border-top: 1px solid var(--panel-line); padding: 3rem 5%;
      text-align: center; color: var(--text-dim); font-size: 0.85rem;
    }
    footer a { color: var(--signal); }
    footer .footer-contact-grid {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 0.4rem 1.6rem; font-family: var(--mono); font-size: 0.82rem; margin: 0.9rem 0;
    }

    a:focus-visible, button:focus-visible { outline: 2px solid var(--pulse); outline-offset: 2px; }
    .neon-title { color: #fff; }
